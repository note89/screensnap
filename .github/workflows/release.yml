name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build app bundle
        run: Scripts/build-app.sh release

      - name: Zip
        run: ditto -c -k --keepParent build/Screensnap.app "Screensnap-${VERSION}.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Screensnap-*.zip
          generate_release_notes: true
